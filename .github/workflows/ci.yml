name: Run tests

on:
  - pull_request
  - push

jobs:
  ci:
    uses: houseabsolute/workflow-perl-dzil-ci/.github/workflows/ci.yml@v0
    with:
      dist: Courriel
      ref: v0
      # File::LibMagic is a runtime dep and cannot build without the libmagic
      # headers. There is no reasonable way to get libmagic on Windows, which
      # is why this dist never had a Windows stage under Azure either.
      apt-packages: libmagic-dev libmagic1
      brew-packages: libmagic
      with-windows: false
